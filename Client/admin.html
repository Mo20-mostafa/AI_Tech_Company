<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS AI - Content Management System</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .admin-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .card {
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            background-color: #fafafa;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-primary { background-color: #cc785c; color: white; }
        .btn-outline { background-color: transparent; border: 1px solid #cc785c; color: #cc785c; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <span>NEXUS AI - Admin Panel</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Back to Website</a>
        </div>
    </nav>

    <div class="admin-container">
        <h2>Manage Services</h2>

        <form id="service-form">
            <input type="hidden" id="service-id">
            <div class="form-group">
                <label for="service-title">Service Title</label>
                <input type="text" id="service-title" placeholder="Enter service title" required>
            </div>
            <div class="form-group">
                <label for="service-desc">Service Description</label>
                <textarea id="service-desc" rows="4" placeholder="Enter service description" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Service</button>
        </form>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

        <h3>Existing Services</h3>
        <div id="services-list">
            <p>Loading services...</p>
        </div>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

        <h3>Customer Inquiries</h3>
        <div id="inquiries-list">
            <p>Loading inquiries...</p>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
